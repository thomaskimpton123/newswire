<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>NEWSWIRE</title>
<style>
  :root{
    --bg:#000;
    --lime:#b6ff2b; --teal:#00e6c3; --cyan:#28e0ff; --yellow:#ffe500;
    --red:#ff2846; --txt:#eaf3ee; --dim:#7d938a; --dim2:#4f635b;
    --line:rgba(255,255,255,.10);
    --sans:"Inter",system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#000}
  body{background:#000;color:var(--txt);font-family:var(--sans);line-height:1.55;min-height:100vh;-webkit-font-smoothing:antialiased;letter-spacing:.1px}
  .wrap{max-width:1040px;margin:0 auto;padding:26px 22px 90px}
  a{color:inherit}
  button{font-family:var(--sans)}

  /* ── wordmark ── */
  .logo{display:inline-flex;align-items:center;font-weight:800;color:#fff;line-height:1;user-select:none;letter-spacing:-.5px}
  .logo .wire{position:relative;display:inline-block;width:.13em;height:.92em;margin:0 .07em;
    background:linear-gradient(180deg,var(--cyan),var(--teal));border-radius:2px;box-shadow:0 0 10px rgba(40,224,255,.7)}
  .logo .wire::before{content:"";position:absolute;top:-.16em;left:50%;transform:translateX(-50%);
    width:.34em;height:.34em;border-radius:50%;background:var(--cyan);
    box-shadow:0 0 8px var(--cyan),0 0 20px rgba(40,224,255,.6);animation:pulse 1.8s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1;transform:translateX(-50%) scale(1)}50%{opacity:.4;transform:translateX(-50%) scale(.8)}}

  /* ── top bar ── */
  .top{display:flex;align-items:center;gap:16px;border-bottom:1px solid var(--line);padding-bottom:18px}
  .menu-btn{display:inline-flex;align-items:center;gap:10px;background:#000;border:1px solid var(--line);
    border-radius:9px;padding:10px 14px;cursor:pointer;color:var(--txt);font-size:13px;font-weight:600;transition:.16s}
  .menu-btn:hover{border-color:var(--teal);color:var(--teal);box-shadow:0 0 16px rgba(0,230,195,.18)}
  .menu-btn .bars{display:inline-flex;flex-direction:column;gap:3px}
  .menu-btn .bars i{width:15px;height:2px;background:currentColor;border-radius:2px;display:block}
  .brandwrap{display:flex;flex-direction:column;gap:4px}
  .top .logo{font-size:clamp(24px,4.6vw,36px)}
  .kicker{color:var(--dim);font-size:10px;letter-spacing:3px;text-transform:uppercase}
  /* ── left drawer (clean / minimal) ── */
  #backdrop{position:fixed;inset:0;background:rgba(0,0,0,.62);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:.22s;z-index:40}
  #backdrop.open{opacity:1;pointer-events:auto}
  #drawer{position:fixed;top:0;left:0;height:100%;width:308px;max-width:85vw;background:#040604;
    border-right:1px solid var(--line);transform:translateX(-105%);transition:transform .24s cubic-bezier(.4,0,.2,1);
    z-index:50;display:flex;flex-direction:column}
  #drawer.open{transform:translateX(0)}
  .dhead{display:flex;align-items:center;justify-content:space-between;padding:22px 22px 18px}
  .dhead .logo{font-size:22px}
  .dclose{background:none;border:none;color:var(--dim);font-size:24px;cursor:pointer;line-height:1;padding:0 2px}
  .dclose:hover{color:var(--red)}
  .dsearch{padding:0 22px 14px}
  .dsearch input{width:100%;background:#000;border:1px solid var(--line);border-radius:8px;padding:9px 12px;
    color:var(--txt);font-size:13px;outline:none;transition:.14s;font-family:var(--sans)}
  .dsearch input::placeholder{color:var(--dim2)}
  .dsearch input:focus{border-color:var(--teal)}
  .dempty{padding:12px;color:var(--dim2);font-size:13px}
  .dlist{overflow-y:auto;padding:4px 12px 12px;flex:1}
  .dgroup{margin-top:16px}
  .dgroup .glabel{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--dim2);padding:0 10px 8px}
  .ditem{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:none;
    border-radius:9px;padding:11px 12px;cursor:pointer;transition:.14s;color:var(--txt);position:relative}
  .ditem:hover{background:rgba(255,255,255,.04)}
  .ditem .t{flex:1;font-size:14px;font-weight:500}
  .ditem .meta{color:var(--dim2);font-size:12px}
  .ditem.active{background:rgba(0,230,195,.10)}
  .ditem.active::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;background:var(--teal);border-radius:3px}
  .ditem.active .t{color:var(--teal)}
  .ditem.src .t{font-weight:400}
  .ditem .cnt{min-width:22px;text-align:center;color:var(--lime);font-weight:700;font-size:13px}
  .ditem .sub{font-size:11px;color:var(--dim2);margin-left:2px}
  .dfoot{padding:14px 22px;border-top:1px solid var(--line);color:var(--dim2);font-size:11px;letter-spacing:.5px}

  .vibe{margin:24px 0 4px;color:var(--dim);font-size:15px;max-width:76ch}

  .sec{margin-top:32px}
  .sec h2{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--dim);margin:0 0 14px;display:flex;align-items:center;gap:10px;font-weight:600}
  .sec h2 .k{color:var(--txt);font-weight:700}
  .sec h2::after{content:"";flex:1;height:1px;background:var(--line)}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
  .card{position:relative;display:block;text-decoration:none;color:inherit;background:#000;
    border:1px solid var(--line);border-radius:12px;padding:16px 18px 16px 20px;transition:.16s;overflow:hidden}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--dim2);transition:.16s}
  .card.must::before{background:var(--red)} .card.worth::before{background:var(--lime)}
  .card.skim::before{background:var(--yellow)} .card.low::before{background:var(--dim2)}
  .card:hover{transform:translateY(-2px)}
  .card.must:hover{border-color:var(--red);box-shadow:0 8px 30px rgba(255,40,70,.18)}
  .card.worth:hover{border-color:var(--lime);box-shadow:0 8px 30px rgba(182,255,43,.16)}
  .card.skim:hover{border-color:var(--yellow);box-shadow:0 8px 30px rgba(255,229,0,.14)}
  .card.low:hover{border-color:var(--dim);box-shadow:0 8px 24px rgba(255,255,255,.06)}
  .ct{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
  .card h3{margin:0;font-size:15px;font-weight:650;line-height:1.35;color:#fff}
  .badge{flex:none;font-size:10px;letter-spacing:.5px;padding:3px 8px;border-radius:20px;border:1px solid;text-transform:uppercase;white-space:nowrap;font-weight:700}
  .badge.must{color:var(--red);border-color:rgba(255,40,70,.5)}
  .badge.worth{color:var(--lime);border-color:rgba(182,255,43,.5)}
  .badge.skim{color:var(--yellow);border-color:rgba(255,229,0,.45)}
  .badge.low{color:var(--dim);border-color:var(--line)}
  .score{color:var(--dim2);margin-left:5px;font-weight:600}
  .src{color:var(--teal);font-size:11px;letter-spacing:.4px;margin:9px 0 7px;text-transform:uppercase}
  .card p{margin:0;font-size:13px;color:var(--dim);line-height:1.5}
  .verdict{margin-top:11px;font-size:12px;color:var(--yellow);border-top:1px solid var(--line);padding-top:9px}

  /* ── hero lead card ── */
  .hero-wrap{margin-top:22px}
  .hero-kicker{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--red);font-weight:700;margin:0 0 10px;display:flex;align-items:center;gap:8px}
  .hero-kicker::before{content:"●";font-size:8px;animation:pulse 1.8s ease-in-out infinite}
  .hero{position:relative;display:block;text-decoration:none;color:inherit;background:linear-gradient(160deg,rgba(255,40,70,.07),rgba(0,0,0,0) 55%),#000;
    border:1px solid rgba(255,40,70,.35);border-radius:16px;padding:28px 30px 26px 32px;transition:.18s;overflow:hidden}
  .hero::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--red);box-shadow:0 0 16px rgba(255,40,70,.55)}
  .hero:hover{border-color:var(--red);box-shadow:0 14px 46px rgba(255,40,70,.22);transform:translateY(-2px)}
  .hero .ct{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}
  .hero h1{margin:0;font-size:clamp(22px,3.6vw,34px);font-weight:800;line-height:1.2;color:#fff;letter-spacing:-.3px}
  .hero .badge{font-size:11px;padding:5px 11px}
  .hero .src{font-size:12px;margin:14px 0 12px}
  .hero p{margin:0;font-size:16px;color:var(--txt);line-height:1.6;max-width:74ch}
  .hero .verdict{margin-top:16px;font-size:13px}
  @media (max-width:560px){
    .hero{padding:20px 18px 20px 20px;border-radius:13px}
    .hero .ct{flex-direction:column;gap:10px}
    .hero p{font-size:14px}
  }

  /* ── new-since-last-visit marker ── */
  .card.is-new::after,.hero.is-new::after{content:"";position:absolute;top:14px;right:14px;width:7px;height:7px;border-radius:50%;
    background:var(--teal);box-shadow:0 0 8px rgba(0,230,195,.85)}
  .card.is-new{border-color:rgba(0,230,195,.30)}
  .hero.is-new::after{top:18px;right:18px;width:9px;height:9px}
  .also a.is-new{box-shadow:inset 3px 0 0 var(--teal)}
  .also a.is-new span:first-child::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;
    background:var(--teal);box-shadow:0 0 6px rgba(0,230,195,.8);margin-right:7px;vertical-align:middle}

  .also{border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .also a{display:flex;justify-content:space-between;gap:12px;text-decoration:none;color:var(--dim);font-size:13px;padding:10px 14px;border-bottom:1px solid var(--line);transition:.12s}
  .also a:last-child{border-bottom:0}
  .also a:hover{color:var(--txt);background:rgba(255,255,255,.03)}
  .also .s{color:var(--dim2);font-size:11px;white-space:nowrap}

  .back{display:inline-flex;align-items:center;gap:8px;background:#000;border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer;color:var(--txt);font-size:13px;margin-top:22px}
  .back:hover{border-color:var(--teal);color:var(--teal)}
  .svhead{margin:20px 0 6px;font-size:26px;font-weight:800;color:#fff}
  .svsub{color:var(--dim);font-size:13px;margin-bottom:6px}

  footer{margin-top:48px;color:var(--dim2);font-size:11px;letter-spacing:.5px;text-align:center;border-top:1px solid var(--line);padding-top:18px}
  #err{color:var(--red);padding:30px;text-align:center}
  #view{transition:opacity .12s ease}
  .quiet{margin-top:36px;padding:44px 20px;text-align:center;color:var(--dim);border:1px dashed var(--line);border-radius:12px;font-size:14px}
  @keyframes flash{0%{box-shadow:0 0 0 2px rgba(0,230,195,.65)}100%{box-shadow:0 0 0 2px rgba(0,230,195,0)}}
  .card.flash{animation:flash 1.1s ease}
  .also a.flash{background:rgba(0,230,195,.14)}
  /* ── v2: read-time, recurring, coverage, keyboard, density ── */
  .rt{color:var(--dim2)}
  .recur{color:var(--cyan);font-weight:600}
  .covered{margin-top:10px;font-size:11.5px;color:var(--dim2)}
  .covered .cvl{color:var(--teal);cursor:pointer;border-bottom:1px dotted rgba(0,230,195,.5)}
  .covered .cvl:hover{color:#fff}
  .card.kfocus,.hero.kfocus{box-shadow:0 0 0 2px var(--teal)!important}
  .toolbtn{display:inline-flex;align-items:center;gap:7px;background:#000;border:1px solid var(--line);
    border-radius:9px;padding:10px 12px;cursor:pointer;color:var(--dim);font-size:13px;font-weight:600;transition:.16s}
  .toolbtn:hover{border-color:var(--teal);color:var(--teal)}
  .toolbtn.on{color:var(--teal);border-color:rgba(0,230,195,.5)}
  .khint{color:var(--dim2);font-size:11px;margin-left:auto;align-self:center}
  .khint b{color:var(--dim);font-weight:700}
  body.dense .card p,body.dense .card .verdict,body.dense .card .covered,body.dense .card .src{display:none}
  body.dense .cards{grid-template-columns:1fr;gap:7px}
  body.dense .card{padding:10px 14px}
  body.dense .card h3{font-size:14px}
  body.dense .hero p,body.dense .hero .verdict{display:none}
  body.dense .vibe{display:none}
  @media(max-width:640px){.khint{display:none}}

  /* ── v3: save-for-later, cloud tab ── */
  .top{flex-wrap:wrap;row-gap:10px}
  .savebtn{position:absolute;bottom:14px;right:16px;width:30px;height:30px;border-radius:50%;
    background:rgba(0,0,0,.55);border:1px solid var(--line);color:var(--dim);font-size:15px;line-height:1;
    cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.14s;z-index:2;padding:0}
  .savebtn:hover{border-color:var(--yellow);color:var(--yellow)}
  .savebtn.on{color:var(--yellow);border-color:rgba(255,229,0,.55);background:rgba(255,229,0,.1)}
  .hero .savebtn{bottom:18px;right:20px;width:34px;height:34px;font-size:18px}
  body.dense .savebtn{width:24px;height:24px;font-size:13px;bottom:8px;right:8px}
  .also a{display:flex;align-items:center;gap:10px}
  .also .albody{display:flex;justify-content:space-between;gap:12px;flex:1;min-width:0}
  .also .savebtn{position:static;width:22px;height:22px;font-size:13px;flex-shrink:0;background:none;border:none}
  .svhead{display:flex;align-items:center;gap:10px}

  /* ── v4: read-time badge, streak, topic pages, sparkline, story timeline ── */
  .streakchip{display:inline-flex;align-items:center;gap:6px;color:var(--yellow);font-size:12px;font-weight:700;
    padding:9px 12px;border:1px solid var(--line);border-radius:9px;white-space:nowrap}
  .recur{cursor:pointer}
  .recur:hover{text-decoration:underline}
  .dspark{margin-top:10px}
  .dspark svg{display:block}
  .tlrow{border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-bottom:10px}
  .tldate{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim2);margin-bottom:6px}
  .tldate .sub{color:var(--dim2);font-weight:400;letter-spacing:0;text-transform:none;margin-left:6px}
  .tltitle{display:block;color:#fff;font-size:15px;font-weight:650;text-decoration:none;line-height:1.4}
  .tltitle:hover{color:var(--teal)}
  .tlverdict{margin-top:8px;font-size:12px;color:var(--yellow);border-top:1px solid var(--line);padding-top:8px}

  /* ── v5: archive search, story threads ── */
  .search-box{margin:20px 0 24px}
  .search-box input{width:100%;background:#000;border:1px solid var(--line);border-radius:12px;
    padding:14px 18px;color:var(--txt);font-size:16px;outline:none;font-family:var(--sans);transition:.14s}
  .search-box input::placeholder{color:var(--dim2)}
  .search-box input:focus{border-color:var(--teal);box-shadow:0 0 20px rgba(0,230,195,.15)}
  .search-count{color:var(--dim);font-size:13px;margin-bottom:16px}
  .thread-card{border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin-bottom:16px;
    background:linear-gradient(160deg,rgba(40,224,255,.04),transparent 50%)}
  .thread-header{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .thread-span{flex:none;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--cyan);
    font-weight:700;padding:4px 10px;border:1px solid rgba(40,224,255,.35);border-radius:20px;white-space:nowrap}
  .thread-title{font-size:16px;font-weight:700;color:#fff;line-height:1.35}
  .thread-best{font-size:12px;color:var(--dim);margin-top:2px}
  .thread-entries{padding-left:12px;border-left:2px solid rgba(40,224,255,.25)}
  .thread-entries .tlrow{border:none;border-bottom:1px solid var(--line);border-radius:0;padding:12px 16px;margin:0}
  .thread-entries .tlrow:last-child{border-bottom:none}
  .threads-summary{color:var(--dim);font-size:13px;margin-bottom:20px}
</style>
</head>
<body>
<div id="backdrop"></div>
<aside id="drawer">
  <div class="dhead"><span class="logo">NEWSW<span class="wire"></span>RE</span><button class="dclose" id="dclose" title="Close">×</button></div>
  <div class="dsearch"><input id="dsearch" type="text" placeholder="Filter today's stories…" autocomplete="off" /></div>
  <div class="dlist" id="dlist"></div>
  <div class="dfoot"><div id="dfoot"></div><div id="dspark" class="dspark"></div></div>
</aside>

<div class="wrap">
  <div class="top">
    <button class="menu-btn" id="menuBtn"><span class="bars"><i></i><i></i><i></i></span> Menu</button>
    <div class="brandwrap">
      <span class="logo">NEWSW<span class="wire"></span>RE</span>
      <span class="kicker">cyber · ai · infra briefing</span>
    </div>
    <button class="toolbtn" id="cloudBtn" title="Cloud &amp; DevOps items, auto-detected from today's briefing">☁ Cloud</button>
    <button class="toolbtn" id="savedTopBtn" title="Your saved-for-later stories">★ Saved</button>
    <button class="toolbtn" id="denseBtn" title="Toggle density (cards / dense list)">▤ Dense</button>
    <button class="toolbtn" id="searchBtn" title="Search across all archived briefings">⌕ Search</button>
    <button class="toolbtn" id="threadsBtn" title="Multi-day story threads">↻ Threads</button>
    <span class="streakchip" id="streakChip" title="Consecutive days you've opened NEWSWIRE"></span>
    <span class="khint">press <b>/</b> search · <b>j/k</b> move · <b>enter</b> open</span>
  </div>
  <div id="view"></div>
  <footer>NEWSWIRE · curated + rated by Tom 📰 · <span id="gen"></span> · archive rolls off after 12 days</footer>
</div>

<script>
const BADGE={must:"MUST",worth:"WORTH IT",skim:"SKIM",low:"NOTED"};
const SEC=[["cyber","CYBERSECURITY"],["ai","ARTIFICIAL INTELLIGENCE"],["it","IT / INFRA"],["videos","VIDEOS WATCHED"]];
let DATA=null, DATES=[], CUR=null, CUR_VIEW="main";
let MASTER=null, RECUR=new Map(), navEls=[], navIdx=-1;
const clone=o=>JSON.parse(JSON.stringify(o));
const STOP=new Set(("the a an of to in on for and or with as at by from is are was were be been being it its this that these those into over after amid vs your you his her their our we they i "+
  "can could will would should has have had not no more most than then out up down off about new now "+
  "critical flaw flaws vulnerability vulnerabilities exploited exploit exploits actively active warns warn "+
  "lets let uses use using update updates released release reported report says say via "+
  "bug bugs hackers hacker attack attacks hit hits confirms confirm").split(/\s+/).filter(Boolean));
function sig(t){return (t||"").toLowerCase().replace(/[^a-z0-9 ]/g," ").split(/\s+/).filter(w=>w.length>2&&!STOP.has(w));}
function overlapCount(a,b){const sb=new Set(b);let n=0;for(const w of new Set(a))if(sb.has(w))n++;return n;}
function related(a,b){const ov=overlapCount(a,b);const uni=new Set([...a,...b]).size||1;return ov>=3||(ov>=2&&ov/uni>=0.5);}
function readTime(it){if(!it.summary)return "";const w=it.summary.trim().split(/\s+/).filter(Boolean).length;return "~"+Math.max(1,Math.ceil(w/200))+" min";}
function totalReadMinutes(d){
  let words=0;
  for(const [key] of SEC)(d.sections?.[key]||[]).forEach(it=>{ if(it.summary) words+=it.summary.trim().split(/\s+/).filter(Boolean).length; });
  return words?Math.max(1,Math.ceil(words/200)):0;
}

/* ── new-since-last-visit ── */
let SEEN=new Set(), LAST_VISIT=null;
try{
  LAST_VISIT=localStorage.getItem("nw_last_visit");
  const raw=localStorage.getItem("nw_seen_ids");
  if(raw) SEEN=new Set(JSON.parse(raw));
}catch(e){}
function idOf(it){ return it.url||it.title||""; }
function isNewItem(it){ return !!LAST_VISIT && !SEEN.has(idOf(it)); }
function persistVisit(ids){
  try{
    const merged=new Set([...SEEN,...ids]);
    localStorage.setItem("nw_seen_ids", JSON.stringify(Array.from(merged).slice(-1000)));
    localStorage.setItem("nw_last_visit", new Date().toISOString());
  }catch(e){}
}

/* ── save for later ── */
let SAVED=[];
try{ SAVED=JSON.parse(localStorage.getItem("nw_saved")||"[]"); }catch(e){ SAVED=[]; }
let ITEM_BY_KEY=new Map();
function isSavedKey(key){ return SAVED.some(s=>s._key===key); }
function persistSaved(){ try{ localStorage.setItem("nw_saved", JSON.stringify(SAVED)); }catch(e){} }
function toggleSave(key){
  const idx=SAVED.findIndex(s=>s._key===key);
  if(idx>=0){ SAVED.splice(idx,1); }
  else{
    const it=ITEM_BY_KEY.get(key);
    if(!it) return;
    SAVED.unshift({_key:key, title:it.title, url:it.url, source:it.source, loc:it.loc, score:it.score,
      badge:it.badge, summary:it.summary, verdict:it.verdict, channel:it.channel,
      savedAt:new Date().toISOString(), fromDate:CUR});
  }
  persistSaved();
  updateSavedCount();
  if(CUR_VIEW==="saved"){ renderSaved(); return; }
  document.querySelectorAll(`.savebtn[data-save-id="${CSS.escape(key)}"]`).forEach(b=>{
    const on=isSavedKey(key); b.textContent=on?"★":"☆"; b.classList.toggle("on",on); b.title=on?"Saved":"Save for later";

/* ── auto-topic pages: keyword-detected topic hubs, generalized beyond Cloud ── */
// word-boundary matched (not naive substring) so short tokens like "aws" don't false-positive
// inside unrelated words (e.g. "flaws", "laws")
function escRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"); }
const TOPICS=[
  {key:"cloud", label:"Cloud & DevOps", keywords:["aws","amazon web services","azure","gcp","google cloud",
    "kubernetes","k8s","terraform","serverless","devops","docker","ec2","lambda","s3 bucket","cloudflare",
    "microservice","helm chart","infrastructure as code","cloud native","multi-cloud","hybrid cloud",
    "openshift","vmware","cloud engineer","site reliability","sre"],
    stems:["load balanc"]}, // deliberately open-ended: matches balancer/balancing too
  {key:"openai", label:"OpenAI", keywords:["openai","chatgpt","gpt-4","gpt-5","gpt-6","sam altman","sora","dall-e","codex"]},
  {key:"anthropic", label:"Anthropic", keywords:["anthropic","claude ai","claude code","claude opus",
    "claude sonnet","claude haiku","dario amodei"]},
  {key:"ransomware", label:"Ransomware", keywords:["ransomware","ransom gang","lockbit","extortion",
    "double extortion","encrypted its network","encrypted their network"]},
  {key:"zeroday", label:"Zero-Day", keywords:["zero-day","zero day","0-day","actively exploited",
    "actively exploiting","in the wild exploitation","under active attack"]},
];
TOPICS.forEach(t=>{
  const kw="\\b(?:"+t.keywords.map(escRe).join("|")+")\\b";
  const stems=(t.stems&&t.stems.length)?"|\\b(?:"+t.stems.map(escRe).join("|")+")":"";
  t.re=new RegExp(kw+stems,"i");
});
function isTopicItem(it,t){
  return t.re.test((it.title||"")+" "+(it.summary||""));
}
function topicCounts(d){
  const items=allItems(d);
  return TOPICS.map(t=>({...t,count:items.filter(it=>isTopicItem(it,t)).length}));
}

function esc(s){return (s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
function badgeFor(it){ if(it.badge) return it.badge; const s=it.score||0; return s>=9?"must":s>=7?"worth":s>=5?"skim":"low"; }
function relLabel(d){const x=new Date(d+"T00:00:00"),t=new Date();t.setHours(0,0,0,0);const n=Math.round((t-x)/864e5);return n<=0?"Today":n===1?"Yesterday":n+" days ago";}

function allItems(d){const out=[];for(const [k] of SEC)(d.sections?.[k]||[]).forEach(i=>out.push({...i,_sec:k}));(d.also||[]).forEach(i=>out.push({...i,_sec:"also"}));return out;}
function locCounts(d){const c={};allItems(d).forEach(i=>{const l=i.loc||i.source;if(l)c[l]=(c[l]||0)+1;});return Object.entries(c).map(([name,count])=>({name,count})).sort((a,b)=>b.count-a.count||a.name.localeCompare(b.name));}

// render-time guard: anything scoring <5 in a surfaced section is demoted into ALSO HAPPENED, regardless of what the JSON says
function normalize(d){
  const also=[...(d.also||[])];
  const seen=new Set(also.map(i=>i.url||i.title));
  const sections={};
  for(const [key] of SEC){
    const kept=[];
    for(const it of (d.sections?.[key]||[])){
      if((it.score||0)<5){
        const id=it.url||it.title;
        if(!seen.has(id)){ seen.add(id); also.push(it); }
      } else kept.push(it);
    }
    sections[key]=kept;
  }
  let idx=0;
  for(const [key] of SEC) sections[key].forEach(it=>it._id="it"+(idx++));
  also.forEach(it=>it._id="it"+(idx++));
  return {...d, sections, also};
}

function metaLine(it){
  const chan=it.channel?`${esc(it.channel)} · `:"";
  const rt=readTime(it), rec=RECUR.get(idOf(it));
  const bits=[];
  if(rec) bits.push(`<span class="recur" data-tl-id="${esc(idOf(it))}">↻ ${rec}d running</span>`);
  bits.push(`${chan}${esc(it.source||"")}`);
  if(rt) bits.push(`<span class="rt">${rt} read</span>`);
  return bits.join(" · ");
}
function coverBlk(covered){
  if(!covered||!covered.length) return "";
  return `<div class="covered">＋ also covered by ${covered.map(c=>
    `<span class="cvl" onclick="event.stopPropagation();event.preventDefault();window.open('${encodeURI(c.url||"")}','_blank','noopener')">${esc(c.source||"link")}</span>`).join(" · ")}</div>`;
}
function card(it,covered){
  const b=badgeFor(it);
  const verdict=it.verdict?`<div class="verdict">▶ ${esc(it.verdict)}</div>`:"";
  const body=it.summary?`<p>${esc(it.summary)}</p>`:"";
  const isNew=isNewItem(it)?" is-new":"";
  return `<a class="card ${b}${isNew}" id="${it._id||""}" href="${esc(it.url)}" target="_blank" rel="noopener">
    ${saveBtnHtml(it)}
    <div class="ct"><h3>${esc(it.title)}</h3><span class="badge ${b}">${BADGE[b]}<span class="score">${it.score??""}</span></span></div>
    <div class="src">${metaLine(it)}</div>${body}${coverBlk(covered)}${verdict}</a>`;
}

// picks the single highest-scored item across surfaced sections and removes it so it isn't duplicated below
function pickHero(d){
  let best=null,bestKey=null,bestIdx=-1;
  for(const [key] of SEC){
    (d.sections?.[key]||[]).forEach((it,idx)=>{
      if(!best || (it.score||0)>(best.score||0)){ best=it; bestKey=key; bestIdx=idx; }
    });
  }
  if(best) d.sections[bestKey].splice(bestIdx,1);
  return best;
}

function heroCard(it,covered){
  if(!it) return "";
  const b=badgeFor(it);
  const verdict=it.verdict?`<div class="verdict">▶ ${esc(it.verdict)}</div>`:"";
  const body=it.summary?`<p>${esc(it.summary)}</p>`:"";
  const isNew=isNewItem(it)?" is-new":"";
  return `<div class="hero-wrap"><div class="hero-kicker">Today's Must-Read</div>
    <a class="hero${isNew}" id="${it._id||""}" href="${esc(it.url)}" target="_blank" rel="noopener">
    ${saveBtnHtml(it)}
    <div class="ct"><h1>${esc(it.title)}</h1><span class="badge ${b}">${BADGE[b]}<span class="score">${it.score??""}</span></span></div>
    <div class="src">${metaLine(it)}</div>${body}${coverBlk(covered)}${verdict}</a></div>`;
}

// group items within a section that cover the same story: highest-score = lead, rest become "also covered by"
function clusterMap(d){
  const skip=new Set(), covered={};
  for(const [key] of SEC){
    const arr=d.sections?.[key]||[];
    const order=arr.map((_,i)=>i).sort((x,y)=>(arr[y].score||0)-(arr[x].score||0));
    for(let a=0;a<order.length;a++){
      const i=order[a]; if(skip.has(arr[i]._id))continue; const si=sig(arr[i].title);
      for(let b2=a+1;b2<order.length;b2++){
        const j=order[b2]; if(skip.has(arr[j]._id))continue;
        if(related(si,sig(arr[j].title))){ skip.add(arr[j]._id); (covered[arr[i]._id]=covered[arr[i]._id]||[]).push({source:arr[j].source||arr[j].loc,url:arr[j].url}); }
      }
    }
  }
  return {skip,covered};
}
function renderMain(){
  CUR_VIEW="main";
  const mins=totalReadMinutes(MASTER);
  const d=clone(MASTER); DATA=d; buildDrawer(MASTER);
  gen.textContent="generated "+new Date(d.generated).toLocaleString()+(mins?` · ⏱ ${mins} min briefing today`:"");
  const {skip,covered}=clusterMap(d);
  const hero=pickHero(d);
  let h=`<p class="vibe">${esc(d.vibe)}</p>`+heroCard(hero,hero?covered[hero._id]:null);
  let any=!!hero;
  for(const [key,label] of SEC){
    const arr=(d.sections?.[key]||[]).filter(it=>!skip.has(it._id)); if(!arr.length) continue;
    any=true;
    h+=`<section class="sec"><h2><span class="k">${label}</span></h2><div class="cards">${arr.map(it=>card(it,covered[it._id])).join("")}</div></section>`;
  }
  if(d.also?.length){
    any=true;
    h+=`<section class="sec"><h2><span class="k">ALSO HAPPENED</span> · below the bar</h2><div class="also">`+
      d.also.map(a=>`<a class="${isNewItem(a)?"is-new":""}" href="${esc(a.url)}" id="${a._id||""}" target="_blank" rel="noopener"><span class="albody"><span>▹ ${esc(a.title)}</span><span class="s">${esc(a.source)}</span></span>${saveBtnHtml(a)}</a>`).join("")+`</div></section>`;
  }
  if(!any) h+=`<div class="quiet">Quiet day — nothing cleared the bar.</div>`;
  view.style.opacity=0;
  view.innerHTML=h;
  requestAnimationFrame(()=>{ view.style.opacity=1; });

}

  view.innerHTML=
    `<button class="back" id="back">← all sections</button>
     <div class="svhead">↻ Story Timeline</div>

     <div id="tlbody" class="quiet">Loading timeline…</div>`;

  const daysAsc=DATES.slice().reverse(); // oldest → newest
  const rows=[];
  for(const x of daysAsc){
    const d=x===CUR?MASTER:await fetchDay(x);

    if(best) rows.push({date:x,item:best});

  const body=document.getElementById("tlbody");
  if(!body) return; // user navigated away while we were fetching
  if(!rows.length){ body.textContent="No archived coverage found for this story."; return; }

      <div class="tldate">${relLabel(r.date)}<span class="sub">${r.date}</span></div>

}

/* keyboard navigation (HN-style) */
function navMove(dir){
  if(!navEls.length)return;
  if(navIdx>=0&&navEls[navIdx])navEls[navIdx].classList.remove("kfocus");
  navIdx=(navIdx+dir+navEls.length)%navEls.length;
  const el=navEls[navIdx]; el.classList.add("kfocus"); el.scrollIntoView({behavior:"smooth",block:"center"});
}
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){ closeDrawer(); if(navIdx>=0&&navEls[navIdx])navEls[navIdx].classList.remove("kfocus"); navIdx=-1; return; }
  const typing=document.activeElement&&(document.activeElement.tagName==="INPUT"||document.activeElement.tagName==="TEXTAREA");
  if(e.key==="/"&&!typing){ e.preventDefault(); openDrawer(); setTimeout(()=>dsearch.focus(),60); return; }
  if(typing) return;
  if(e.key==="j"||e.key==="ArrowDown"){ e.preventDefault(); navMove(1); }
  else if(e.key==="k"||e.key==="ArrowUp"){ e.preventDefault(); navMove(-1); }
  else if(e.key==="Enter"&&navIdx>=0&&navEls[navIdx]){ navEls[navIdx].click(); }
});

// shared cache of parsed/normalized archive days, so recurrence / sparkline / timeline don't refetch
let DAY_CACHE=new Map();
async function fetchDay(date){
  if(DAY_CACHE.has(date)) return DAY_CACHE.get(date);
  let result=null;
  try{ const raw=await (await fetch(`data/${date}.json?_=`+Date.now())).json(); result=normalize(raw); }
  catch(e){ result=null; }
  DAY_CACHE.set(date,result);
  return result;
}

async function load(date){
  CUR=date;
  if(dsearch) dsearch.value="";
  const raw=await (await fetch(`data/${date}.json?_=`+Date.now())).json();
  MASTER=normalize(raw);
  DAY_CACHE.set(date,MASTER);
  ITEM_BY_KEY=new Map(); allItems(MASTER).forEach(it=>ITEM_BY_KEY.set(idOf(it),it));
  RECUR=new Map();
  const idsSnapshot=allItems(MASTER).map(idOf); // snapshot before render
  renderMain();
  buildRecurrence();   // async: fetch recent days, mark recurring stories, re-render
  return idsSnapshot;
}

// mark stories that keep recurring across the archive (BBC/Reuters "ongoing" cue)
async function buildRecurrence(){
  const priors=DATES.filter(x=>x!==CUR).slice(0,7);
  if(!priors.length || !MASTER) return;
  let days;
  try{
    days=await Promise.all(priors.map(async x=>{
      const d=await fetchDay(x);
      return d?allItems(d).map(o=>sig(o.title)):[];
    }));
  }catch(e){ return; }
  const rec=new Map();
  for(const it of allItems(MASTER)){
    const si=sig(it.title); if(si.length<2) continue; let cnt=0;
    for(const dayItems of days){ if(dayItems.some(sj=>related(si,sj))) cnt++; }
    if(cnt>=1) rec.set(idOf(it), cnt+1);
  }
  if(rec.size && CUR){ RECUR=rec; renderMain(); }
}

// 12-day "how heavy was the news" pulse: MUST-read item count per archived day
async function buildSparkline(){
  const el=document.getElementById("dspark");
  if(!el || !DATES.length) return;
  const dates=DATES.slice(0,12);
  const counts=await Promise.all(dates.map(async x=>{
    const d=x===CUR?MASTER:await fetchDay(x);
    if(!d) return 0;
    return allItems(d).filter(it=>badgeFor(it)==="must").length;
  }));
  if(document.getElementById("dspark")!==el) return; // drawer rebuilt meanwhile
  const max=Math.max(1,...counts);
  const w=260,h=28,ordered=counts.slice().reverse(); // oldest → newest, left to right
  const stepX=ordered.length>1?w/(ordered.length-1):w;
  const pts=ordered.map((c,i)=>`${(i*stepX).toFixed(1)},${(h-(c/max)*h).toFixed(1)}`).join(" ");
  el.innerHTML=`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <polyline points="${pts}" fill="none" stroke="#28e0ff" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
  </svg>`;
}

/* ── reading streak: consecutive calendar days the page has been opened ── */
function dayKey(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function updateStreak(){
  try{
    const today=dayKey(new Date());
    const lastDay=localStorage.getItem("nw_streak_day");
    let streak=parseInt(localStorage.getItem("nw_streak")||"0",10)||0;
    if(lastDay===today) return streak; // already counted today
    if(lastDay){
      const y=new Date(lastDay+"T00:00:00"); y.setDate(y.getDate()+1);
      streak=(dayKey(y)===today)?streak+1:1;
    } else streak=1;
    localStorage.setItem("nw_streak",String(streak));
    localStorage.setItem("nw_streak_day",today);
    return streak;
  }catch(e){ return 0; }
}
function renderStreak(){
  const chip=document.getElementById("streakChip");
  if(!chip) return;
  const n=updateStreak();
  chip.textContent=n>=2?`🔥 ${n}-day streak`:"🔥 Day 1";
}

     <div class="svhead">⌕ Archive Search</div>
     <div class="svsub">Search across all ${DATES.length} briefings</div>
     <div class="search-box"><input id="archiveQ" type="text" placeholder="Search headlines & summaries…" autocomplete="off" /></div>
     <div id="searchResults" class="quiet">Type to search across all archived briefings.</div>`;
  document.getElementById("back").onclick=()=>renderMain();
  const input=document.getElementById("archiveQ");
  let timer=null;
  input.addEventListener("input",()=>{clearTimeout(timer);timer=setTimeout(()=>runArchiveSearch(input.value),300);});
  input.focus();
  navEls=[];navIdx=-1;
  window.scrollTo(0,0);
}
async function runArchiveSearch(query){
  const box=document.getElementById("searchResults");
  if(!box) return;
  const q=query.trim().toLowerCase();
  if(!q){box.className="quiet";box.textContent="Type to search across all archived briefings.";return;}
  box.className="";box.innerHTML='<div class="quiet">Searching…</div>';
  const results=[];
  for(const date of DATES){
    const d=await fetchDay(date);
    if(!d) continue;
    for(const it of allItems(d)){
      const hay=((it.title||"")+" "+(it.summary||"")).toLowerCase();
      if(hay.includes(q)) results.push({...it,_date:date});
    }
  }
  if(document.getElementById("searchResults")!==box) return;
  if(!results.length){box.innerHTML='<div class="quiet">No results found.</div>';return;}
  const groups={};
  for(const r of results)(groups[r._date]=groups[r._date]||[]).push(r);
  let html=`<div class="search-count">${results.length} result${results.length!==1?"s":""} across ${Object.keys(groups).length} day${Object.keys(groups).length!==1?"s":""}</div>`;
  for(const date of DATES){
    if(!groups[date]) continue;
    html+=`<section class="sec"><h2><span class="k">${relLabel(date)}</span> · ${date}</h2><div class="cards">${groups[date].map(it=>card(it)).join("")}</div></section>`;
  }
  box.innerHTML=html;
  navEls=[...box.querySelectorAll(".card")];navIdx=-1;
}

/* ── v5: story threads ── */
async function renderThreads(){
  CUR_VIEW="threads";
  view.innerHTML=
    `<button class="back" id="back">← all sections</button>
     <div class="svhead">↻ Story Threads</div>
     <div class="svsub">Stories tracked across multiple briefings</div>
     <div id="threadsBody" class="quiet">Building threads…</div>`;
  document.getElementById("back").onclick=()=>renderMain();
  navEls=[];navIdx=-1;
  window.scrollTo(0,0);
  const allDays=[];
  for(const date of DATES){
    const d=await fetchDay(date);
    if(!d) continue;
    allDays.push({date,items:allItems(d)});
  }
  const threads=[],used=new Set();
  for(const{date,items}of allDays){
    for(const it of items){
      const key=idOf(it);
      if(used.has(key)) continue;
      const si=sig(it.title);
      if(si.length<2) continue;
      const entries=[{date,item:it}];
      used.add(key);
      for(const other of allDays){
        if(other.date===date) continue;
        for(const oit of other.items){
          const okey=idOf(oit);
          if(used.has(okey)) continue;
          if(related(si,sig(oit.title))){entries.push({date:other.date,item:oit});used.add(okey);}
        }
      }
      if(entries.length>=2){
        entries.sort((a,b)=>a.date.localeCompare(b.date));
        threads.push({title:entries[entries.length-1].item.title,bestScore:Math.max(...entries.map(e=>e.item.score||0)),days:entries.length,entries});
      }
    }
  }
  const body=document.getElementById("threadsBody");
  if(!body) return;
  if(!threads.length){body.textContent="No recurring stories found across the archive.";return;}
  threads.sort((a,b)=>b.days-a.days||b.bestScore-a.bestScore);
  body.className="";
  body.innerHTML=`<div class="threads-summary">${threads.length} thread${threads.length!==1?"s":""} detected across ${DATES.length} days</div>`+
    threads.map(t=>`<div class="thread-card">
      <div class="thread-header"><span class="thread-span">${t.days} days</span><span class="thread-title">${esc(t.title)}</span></div>
      <div class="thread-entries">${t.entries.map(e=>`<div class="tlrow">
        <div class="tldate">${relLabel(e.date)}<span class="sub">${e.date}</span></div>
        <a class="tltitle" href="${esc(e.item.url)}" target="_blank" rel="noopener">${esc(e.item.title)}</a>
        ${e.item.verdict?`<div class="tlverdict">▶ ${esc(e.item.verdict)}</div>`:""}</div>`).join("")}
      </div></div>`).join("");
}

async function boot(){
  try{
    const man=await (await fetch("data/manifest.json?_="+Date.now())).json();
    DATES=(man.briefings||[]).slice(0,12);
    const ids=await load(DATES[0]);
    persistVisit(ids);
    renderStreak();
  }catch(e){
    view.innerHTML=`<div id="err">⚠ FEED OFFLINE — no briefings published yet.<br><small>${esc(e.message)}</small></div>`;
  }
}
// auto-pick-up a new day's briefing when an already-open tab regains focus
async function checkFresh(){
  try{
    const man=await (await fetch("data/manifest.json?_="+Date.now())).json();
    const latest=(man.briefings||[])[0];
    if(latest && latest!==DATES[0]) boot();   // only reload when there's genuinely a new briefing
  }catch(e){}
}
/* auto-update: reload when a new build ships (beats iOS home-screen caching) */
let BUILD=null;
async function checkBuild(){
  try{
    const v=(await (await fetch('version.txt?_='+Date.now(),{cache:'no-store'})).text()).trim();
    if(!v)return;
    if(BUILD===null){BUILD=v;return;}
    if(v!==BUILD){ location.replace(location.pathname+'?v='+encodeURIComponent(v)); }
  }catch(e){}
}
document.addEventListener("visibilitychange",()=>{ if(!document.hidden){ checkFresh(); checkBuild(); } });
setInterval(checkFresh, 10*60*1000);
setInterval(checkBuild, 60*1000);
checkBuild();
boot();
</script>
